name: Deploy FE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on:
      - self-hosted

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # Avoid GitHub Actions cache restore on the self-hosted runner. The
        # remote cache can be hundreds of MB and may stall until timeout.
        # npm still reuses the runner-local cache when it is available.
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Create production env
        run: |
          cat > .env.production <<'EOF'
          VITE_API_URL=https://api.eapls.io.vn
          VITE_API_ROOT=https://api.eapls.io.vn/api
          VITE_REACT_APP_API_ROOT=https://api.eapls.io.vn/api
          VITE_GOOGLE_CLIENT_ID=147676468818-86oa6l06us45c8as6272v1mbc6egenf5.apps.googleusercontent.com
          EOF

          cat > public/config.js <<'EOF'
          window.env = {
            API_ROOT: "https://api.eapls.io.vn/api",
            BASE_URL: "https://api.eapls.io.vn",
            HASH_KEY: "HASH_KEY",
          }
          EOF

      - name: Build
        run: npm run build

      - name: Publish to Nginx web root
        run: |
          # Keep old hashed assets so already-open browser tabs can finish loading.
          # npm run build already verified that the new dist is internally consistent.
          rsync -a --delay-updates dist/ /var/www/eapls-fe/

      - name: Verify published assets
        run: node scripts/verify-dist-assets.mjs /var/www/eapls-fe
