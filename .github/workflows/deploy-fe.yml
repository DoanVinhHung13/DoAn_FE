name: Deploy FE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-main
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: 22
  WEB_ROOT: /var/www/eapls-fe
  SITE_URL: https://eapls.io.vn

jobs:
  deploy:
    name: Build & Deploy to Nginx
    runs-on:
      - self-hosted

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Create production env
        run: |
          set -euo pipefail

          cat > .env.production <<'EOF'
          VITE_API_URL=https://api.eapls.io.vn
          VITE_API_ROOT=https://api.eapls.io.vn/api
          VITE_REACT_APP_API_ROOT=https://api.eapls.io.vn/api
          VITE_GOOGLE_CLIENT_ID=147676468818-86oa6l06us45c8as6272v1mbc6egenf5.apps.googleusercontent.com
          EOF

          cat > public/config.js <<'EOF'
          window.env = {
            API_ROOT: "https://api.eapls.io.vn/api",
            BASE_URL: "https://api.eapls.io.vn",
            HASH_KEY: "HASH_KEY",
          }
          EOF

      - name: Build
        run: npm run build

      - name: Verify deploy prerequisites
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$WEB_ROOT" ]; then
            echo "$WEB_ROOT does not exist. Create the directory and grant write access to the runner user."
            exit 1
          fi

          if [ ! -w "$WEB_ROOT" ]; then
            echo "$WEB_ROOT is not writable by $(whoami). Run: sudo chown -R $(whoami):$(whoami) $WEB_ROOT"
            exit 1
          fi

          echo "Deploy target $WEB_ROOT is ready (writable by $(whoami))."

      - name: Publish to Nginx web root
        shell: bash
        run: |
          set -euo pipefail

          # Keep old hashed assets so already-open browser tabs can finish loading.
          # npm run build already verified that the new dist is internally consistent.
          rsync -rlt --delay-updates --no-owner --no-group --no-perms dist/ "$WEB_ROOT/"

      - name: Verify published assets
        run: node scripts/verify-dist-assets.mjs "$WEB_ROOT"

      - name: Verify site is accessible
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..5}; do
            if curl --fail --silent --show-error -o /dev/null "$SITE_URL"; then
              echo "Site is accessible at $SITE_URL"
              exit 0
            fi
            echo "Site not ready yet. Attempt $attempt/5."
            sleep 2
          done

          echo "Site is not accessible at $SITE_URL after 5 attempts."
          curl --fail --show-error "$SITE_URL"
